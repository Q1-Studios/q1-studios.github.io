<svg width="1914" height="362" viewBox="0 0 1914 362" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
    <radialGradient id="sun-glow">
        <stop offset="0.35" stop-color="#fdddce" stop-opacity="0.8"/>
        <stop offset="0.6" stop-color="#fbac8e" stop-opacity="0.45"/>
        <stop offset="1" stop-color="#fbac8e" stop-opacity="0"/>
    </radialGradient>
</defs>
<style>
    /* the sun slowly sinks behind the far range and rises again; its glow softly pulses */
    .sun{ animation: sun-set 16s ease-in-out infinite alternate; }
    .sun-glow{ transform-box: view-box; transform-origin: 560px 140px; animation: sun-glow 4s ease-in-out infinite alternate; }
    @keyframes sun-set{ from{ transform: translateY(-8px); } to{ transform: translateY(32px); } }
    @keyframes sun-glow{ from{ opacity: 0.7; transform: scale(0.94); } to{ opacity: 1; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce){ .sun, .sun-glow{ animation: none; } }
</style>
<!-- setting sun, half hidden behind the far range -->
<g class="sun">
    <circle class="sun-glow" cx="560" cy="140" r="140" fill="url(#sun-glow)"/>
    <circle cx="560" cy="140" r="60" fill="#fdddce"/>
</g>

<!-- far range -->
<path d="M0 232L120 196L220 214L380 95L470 150L560 132L760 38L900 150L1000 128L1250 58L1400 165L1500 148L1650 108L1780 176L1914 150V364H0Z" fill="#f1654a"/>
