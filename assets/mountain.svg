<!-- near range with the main peak -->
<path d="M0 330L90 300L160 318L250 268L330 290L420 262L520 300L600 280L700 240L790 255L880 180L950 120L1010 74L1050 96L1090 130L1170 170L1240 214L1320 236L1420 262L1500 250L1600 274L1700 265L1800 300L1914 290V364H0Z" fill="#2a102d"/>
<path d="M1010 74L970 104L986 100L998 110L1013 100L1029 109L1044 101L1061 106L1050 96Z" fill="#7b1135"/>

